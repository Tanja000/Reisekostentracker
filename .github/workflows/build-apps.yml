name: Build TrackMyCent (iOS & Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Ermöglicht manuelles Starten mit 1 Klick auf GitHub

jobs:
  # ------------------------------------------------------------------------
  # 1. iOS Build (Läuft auf virtuellem Apple Mac in der GitHub-Cloud)
  # ------------------------------------------------------------------------
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App (.app)
        run: |
          cd ios
          xcodebuild build \
            -project TrackMyCent.xcodeproj \
            -scheme TrackMyCent \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package TrackMyCent.ipa
        run: |
          mkdir -p ios/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/TrackMyCent.app ios/Payload/
          cd ios
          zip -r TrackMyCent.ipa Payload
          mkdir -p outputs
          mv TrackMyCent.ipa outputs/

      - name: Upload TrackMyCent.ipa (iPhone App)
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyCent-iOS-IPA
          path: ios/outputs/TrackMyCent.ipa
          retention-days: 30

  # ------------------------------------------------------------------------
  # 2. Android Build (Läuft auf Linux in der GitHub-Cloud)
  # ------------------------------------------------------------------------
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload TrackMyCent.apk (Android App)
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyCent-Android-APK
          path: app/build/outputs/apk/debug/TrackMyCent.apk
          retention-days: 30
